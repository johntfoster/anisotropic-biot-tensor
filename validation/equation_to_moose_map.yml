version: 1
configuration: total_Lagrangian_3D_constitutive_plane_strain
objects:
  ConformalMaterial:
    family: AD_material
    equations: [eq:anisotropic-mineral-eos, eq:trace-mineral-stability-domain, eq:equivalent-anisotropic-energy, eq:constitutive-phase-stress-sum, eq:anisotropic-biot-explicit, eq:log-frechet-spectral-form]
    consumes: [ux_gradient, uy_gradient, pressure, pressure_gradient]
    produces: [first_piola, fluid_mass, mass_flux, J, Jbar, solid_fraction, B12]
    derivatives: implicit_mineral_root_lift_and_AD_resolvent_integrals
    approximation: Gauss_Legendre_evaluation_of_matrix_logarithm_integrals
  FabricMaterial:
    family: AD_material
    equations: [eq:fabric-distention-polar, eq:fabric-volume-ratio, eq:fabric-tensor, eq:fabric-equivalent-energy, eq:fabric-distention-stress, eq:fabric-equilibrium, eq:fabric-compliance-restriction, eq:fabric-transverse-h, eq:fabric-transverse-strain, eq:fabric-shape-equilibrium, eq:fabric-transverse-biot, eq:fabric-biot-tensor, eq:reference-biot-compatibility]
    consumes: [ux_gradient, uy_gradient, pressure]
    produces: [first_piola, fluid_mass, J, Jbar, solid_fraction, B, distention_strain]
    derivatives: linearized_reference_state_stationarity
    retained_subspace: span(e1 = I/sqrt(3), e2 = sqrt(3/2)(m(x)m - I/3)); distention stiffness positive definite 2x2 (volume, axial, volume-axial coupling) and zero on the four complementary modes, frozen to the mineral
    symmetry: transversely_isotropic_about_m; verified D:e3 = D:e6 = 0 and rotation invariance 2.5e-16; H reconstruction of eq:fabric-transverse-h exact to 2.2e-16 with eigenvalues (h^-2, h, h)
    approximation: reference_state_linearized_axisymmetric_distention_energy_and_reference_biot_limit; general_finite_deformation_fabric_equilibrium_out_of_scope
  ReferenceMomentum:
    family: AD_kernel
    equation: integral_Grad_test_contract_first_Piola
    variables: [ux, uy]
    FE: Q2
  ReferenceFluidMass:
    family: AD_kernel
    equation: integral_test_mass_increment_over_dt_minus_Grad_test_dot_mass_flux
    variables: [p]
    FE: Q1
    closure: exponential_fluid_EOS_and_constant_isotropic_spatial_mobility
    time_discretization: backward_Euler_on_reference_fluid_mass
  EqualValueBoundaryConstraint:
    family: framework_kinematic_nodal_constraint
    equation: equal_top_normal_displacement_with_summed_force_residual
    approximation: no_penalty_compliance_in_kinematic_formulation
